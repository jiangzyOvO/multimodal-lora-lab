# Run from the experiment root. These settings target this Mac, not CUDA.
model_name_or_path: models/Qwen2-VL-2B-Instruct
template: qwen2_vl
trust_remote_code: false
image_max_pixels: 50176
image_min_pixels: 3136
flash_attn: disabled

stage: sft
do_train: true
do_eval: true
finetuning_type: lora
lora_target: q_proj,v_proj
lora_rank: 4
lora_alpha: 8
lora_dropout: 0.0
freeze_vision_tower: true
freeze_multi_modal_projector: true

dataset_dir: data
media_dir: data
dataset: demo_train
eval_dataset: demo_holdout
cutoff_len: 512
preprocessing_num_workers: 1
dataloader_num_workers: 0
dataloader_pin_memory: false
overwrite_cache: true
packing: false

output_dir: outputs/qwen2vl_lora_mps
overwrite_output_dir: false
logging_steps: 1
save_steps: 10
save_total_limit: 2
save_only_model: false
plot_loss: true
report_to: none

per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 1
gradient_checkpointing: true
learning_rate: 0.0001
max_steps: 20
lr_scheduler_type: cosine
warmup_steps: 2
fp16: false
bf16: true
optim: adamw_torch
max_grad_norm: 1.0
eval_strategy: steps
eval_steps: 10
seed: 42
